name: Build TWRP Recovery

on:
  workflow_dispatch:

jobs:
  build:
    name: Build TWRP Recovery
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clean Up Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo apt-get clean
        df -h

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev libc6-dev-i386 libgl1-mesa-dev libxml2-utils xsltproc zlib1g-dev python3 python3-pip

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize TWRP Workspace & Sync
      run: |
        mkdir twrp
        cd twrp
        git config --global user.name "Zohaib154"
        git config --global user.email "zohaib154@github.com"
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd twrp
        git clone https://github.com/Zohaib154/android_device_xsmart_CORE_X.git device/xsmart/CORE_X

    - name: Build TWRP Image
      run: |
        cd twrp
        source build/envsetup.sh
        lunch omni_CORE_X-eng || lunch omni_CORE_X-userdebug
        make clean
        make bootimage -j$(nproc --all) || make recoveryimage -j$(nproc --all)

    - name: Upload Recovery Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP_Recovery_CORE_X
        path: twrp/out/target/product/CORE_X/*.img
