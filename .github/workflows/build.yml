name: Build Custom Recovery

on:
  workflow_dispatch:
    inputs:
      recovery_type:
        description: 'Select Recovery Project'
        required: true
        default: 'TWRP'
        type: choice
        options:
        - TWRP
        - OrangeFox
        - PitchBlack

jobs:
  build:
    name: Build ${{ github.event.inputs.recovery_type }} Recovery
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clean Up Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo apt-get clean
        df -h

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev libc6-dev-i386 libgl1-mesa-dev libxml2-utils xsltproc zlib1g-dev python3 python3-pip python-is-python3

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize Workspace & Sync Manifest
      run: |
        mkdir -p work
        cd work
        git config --global user.name "Zohaib154"
        git config --global user.email "zohaib154@github.com"
        
        RECOVERY="${{ github.event.inputs.recovery_type }}"
        
        if [ "$RECOVERY" = "TWRP" ]; then
          MANIFEST_URL="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git"
          BRANCH="twrp-12.1"
        elif [ "$RECOVERY" = "OrangeFox" ]; then
          MANIFEST_URL="https://gitlab.com/OrangeFox/Manifest.git"
          BRANCH="fox_12.1"
        elif [ "$RECOVERY" = "PitchBlack" ]; then
          MANIFEST_URL="https://github.com/PitchBlackRecoveryProject/manifest_pb.git"
          BRANCH="android-12.1"
        fi
        
        echo "Syncing $RECOVERY manifest from $MANIFEST_URL (branch: $BRANCH)..."
        repo init --depth=1 -u $MANIFEST_URL -b $BRANCH
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd work
        git clone https://github.com/Zohaib154/android_device_xsmart_CORE_X.git device/xsmart/CORE_X

    - name: Build Recovery Image
      run: |
        cd work
        source build/envsetup.sh
        
        echo "=== Running lunch ==="
        lunch omni_CORE_X-eng || lunch omni_CORE_X-userdebug
        
        echo "=== Starting Compilation ==="
        make bootimage -j$(nproc --all) 2>&1 | tee build.log || make recoveryimage -j$(nproc --all) 2>&1 | tee -a build.log

    - name: Check Build Output
      if: always()
      run: |
        echo "=== Locating compiled output files ==="
        find work/ -name "*.img" -o -name "*.zip" -o -name "build.log"

    - name: Upload Recovery Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.recovery_type }}_Recovery_CORE_X
        path: |
          work/**/*.img
          work/**/*.zip
          work/build.log
        if-no-files-found: warn
