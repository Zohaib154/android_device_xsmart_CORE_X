name: Build TWRP Recovery

on:
  workflow_dispatch:

jobs:
  build:
    name: Build TWRP Image
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev libc6-dev-i386 libgl1-mesa-dev libxml2-utils xsltproc zlib1g-dev python3 python3-pip

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Sync TWRP Source Code
      run: |
        mkdir twrp
        cd twrp
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd twrp
        git clone https://github.com/${{ github.repository }} device/xsmart/CORE_X

    - name: Compile Recovery
      run: |
        cd twrp
        source build/envsetup.sh
        lunch omni_CORE_X-eng
        mka recoveryimage -j$(nproc --all)

    - name: Upload Recovery Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-CORE_X
        path: twrp/out/target/product/CORE_X/recovery.img
